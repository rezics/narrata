name: ci

on:
  push:
  pull_request:

jobs:
  docs-and-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun scripts/docs/check.ts
      # goalctl drives worker processes on the Windows host that runs the Goals.
      - if: matrix.os == 'windows-latest'
        run: bun test scripts
  gamebook-r1:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/gamebook-web/package-lock.json
      - run: cargo fmt --all --check
      - run: cargo clippy -p narrata-nodes -p narrata-nodes-wasm -p narrata-node-tools -p narrata-content-local --all-targets --all-features -- -D warnings
      - run: cargo test -p narrata-nodes -p narrata-nodes-wasm -p narrata-node-tools -p narrata-content-local
      - run: npm ci
        working-directory: examples/gamebook-web
      - run: npm audit --audit-level=high
        working-directory: examples/gamebook-web
      - run: npm run build
        working-directory: examples/gamebook-web
      - run: npx playwright install --with-deps chromium
        working-directory: examples/gamebook-web
      - run: npm run test:e2e
        working-directory: examples/gamebook-web
      - name: Generated files match the committed ones, including new files
        shell: bash
        run: |
          drift="$(git status --porcelain --untracked-files=all -- packages/narrata/nodes/schemas examples/gamebook-web/src/generated products/gamebook-demo)"
          if [ -n "$drift" ]; then echo "$drift"; exit 1; fi
  gate-g3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: wasm32-wasip1
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --doc
      - run: cargo test --release -p narrata-testkit --test golden_codec --test fixtures
      - run: cargo test --release -p narrata-store --test golden --test negative_bundle
      - run: cargo test --release -p narrata-core --test effects
      - run: cargo test --release -p narrata-store --test effects --test federated --test model
      - run: cargo test --release -p narrata-store-sqlite --test sqlite
      - run: cargo check -p narrata-core --target wasm32-wasip1
      - run: cargo check -p narrata-testkit --bin narrata-conformance --target wasm32-wasip1
      - run: cargo check -p narrata-store --target wasm32-wasip1
      - if: matrix.os == 'ubuntu-latest'
        uses: bytecodealliance/actions/wasmtime/setup@v1
      - if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cargo run --quiet -p narrata-testkit --bin narrata-conformance > native.manifest
          cargo build --quiet -p narrata-testkit --bin narrata-conformance --target wasm32-wasip1
          wasmtime target/wasm32-wasip1/debug/narrata-conformance.wasm > wasm.manifest
          diff -u native.manifest wasm.manifest
      - if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-deny
      - if: matrix.os == 'ubuntu-latest'
        run: cargo deny check
      - if: matrix.os == 'ubuntu-latest'
        run: cargo check --manifest-path fuzz/Cargo.toml
