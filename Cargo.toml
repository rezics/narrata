[workspace]
resolver = "3"
members = [
  "crates/narrata-core",
  "crates/narrata-testkit",
  "crates/narrata-cli",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
repository = "https://github.com/rezics/narrata"

[workspace.dependencies]
hex = "0.4.3"
proptest = "1.7.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
unwrap_used = "deny"
