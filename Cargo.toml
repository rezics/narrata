[workspace]
resolver = "3"
members = [
  "crates/narrata-core",
  "crates/narrata-store",
  "crates/narrata-store-sqlite",
  "crates/narrata-testkit",
  "crates/narrata-cli",
  "crates/narrata-protocol",
  "crates/narrata-ffi",
  "crates/narrata-wasm",
  "packages/narrata/kernel/crates/narrata-storage",
  "packages/narrata/kernel/crates/narrata-storage-sqlite",
  "packages/narrata/nodes/crates/narrata-nodes",
  "packages/narrata/nodes/crates/narrata-nodes-wasm",
  "packages/narrata/tooling/crates/narrata-node-tools",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
repository = "https://github.com/rezics/narrata"

[workspace.dependencies]
hex = "0.4.3"
proptest = "1.7.0"
prost = "0.14.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
schemars = "1.2.1"
sha2 = "0.10.9"
thiserror = "2.0.16"
wasm-bindgen = "0.2.105"
rusqlite = { version = "0.37.0", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
unwrap_used = "deny"
