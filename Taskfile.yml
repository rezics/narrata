version: '3'

tasks:
  check:g1:
    desc: Stage 1 gate (fmt, clippy, workspace tests)
    cmds: [pwsh -NoProfile -File scripts/check-g1.ps1]
  check:g2:
    desc: Stage 2 gate (g1 plus persistence)
    cmds: [pwsh -NoProfile -File scripts/check-g2.ps1]
  check:g3:
    desc: Stage 3 gate (g2 plus effects)
    cmds: [pwsh -NoProfile -File scripts/check-g3.ps1]
  check:g4:
    desc: Stage 4 gate (g3 plus statecharts)
    cmds: [pwsh -NoProfile -File scripts/check-g4.ps1]
  check:g5:
    desc: Stage 5 gate (g4 plus migrations and protocol)
    cmds: [pwsh -NoProfile -File scripts/check-g5.ps1]
  check:r1:
    desc: Node stack and Web Gamebook gate (Rust, Wasm, browser regressions, generated-file drift)
    cmds: [pwsh -NoProfile -File scripts/check-r1.ps1]
  check:web-storage:
    desc: IndexedDB storage adapter (type check, vitest) and its Chromium regressions on port 4183
    dir: packages/narrata/kernel/js
    cmds:
      - npm ci
      - npm run check
      - npm test
      - npx playwright install chromium
      - npm run test:browser
  check:server-storage:
    desc: PostgreSQL reference host types, PGlite conformance and optional real PostgreSQL tests
    cmds: [pwsh -NoProfile -File scripts/check-server-storage.ps1]
  web:build:
    desc: Build the standalone @rezics/narrata ESM, declarations and Wasm package
    dir: packages/narrata/web
    cmds:
      - npm ci
      - npm run build
  web:pack:
    desc: Build and pack @rezics/narrata under .temp/web-pack, printing SHA-256 and SHA-512
    cmds:
      - task web:build
      - npm --prefix packages/narrata/web run pack:artifact
  check:web:
    desc: Web package types, unit tests, external tarball install (port 4193) and size budgets
    dir: packages/narrata/web
    cmds:
      - npm ci
      - npm run build
      - npm run check
      - npm test
      - npm run budget
      - npx playwright install chromium
      - npm run test:install
  bench:g2:
    desc: Persistence and kernel benchmarks
    cmds: [pwsh -NoProfile -File scripts/benchmark-g2.ps1]
  bench:nodes:
    desc: Synthetic 100k-choice works, lazy chunk loading and bounded cache measurements
    cmds: ['pwsh -NoProfile -File scripts/benchmark-nodes.ps1 {{.CLI_ARGS}}']
  docs:check:
    desc: Check relative links and heading anchors in Markdown
    cmds:
      - 'bun scripts/docs/check.ts {{.CLI_ARGS}}'
  test:scripts:
    desc: Bun tests for goalctl and the docs checker
    cmds:
      - 'bun test scripts {{.CLI_ARGS}}'
  goal:
    desc: Run goalctl from the repository root. Sets GOAL_MAX_WORKERS to 3 when it is unset.
    cmds:
      - 'GOAL_MAX_WORKERS="${GOAL_MAX_WORKERS-3}" bun scripts/goal/goalctl.ts {{.CLI_ARGS}}'
  goal:manager:
    desc: Start a Goal manager (Claude Code, Opus 5.5, xhigh) in its own Windows Terminal tab; arguments are the Goal slug and optional -Model/-Effort.
    cmds:
      - 'pwsh -NoProfile -File scripts/goal/start-manager.ps1 {{.CLI_ARGS}}'
