description = "Browser binding for Narrata R2 Gamebook sessions and the local content provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
narrata-node-tools = { path = "../../../tooling/crates/narrata-node-tools", version = "=0.1.0-alpha.1" }
narrata-storage-host = { path = "../../../kernel/crates/narrata-storage-host", version = "=0.1.0-alpha.1" }
narrata-content-local = { path = "../../../tooling/crates/narrata-content-local", version = "=0.1.0-alpha.1" }
narrata-kernel = { path = "../../../kernel/crates/narrata-kernel", version = "=0.1.0-alpha.1", features = ["serde"] }
narrata-nodes = { path = "../narrata-nodes", version = "=0.1.0-alpha.1" }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true
