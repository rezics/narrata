[package]
name = "narrata-node-tools"
description = "Filesystem composition, R1 migration and the CLI for Narrata node works"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "narrata-book"
path = "src/main.rs"

[dependencies]
narrata-kernel = { path = "../../../kernel/crates/narrata-kernel", version = "=0.1.0-alpha.1", features = ["serde"] }
narrata-nodes = { path = "../../../nodes/crates/narrata-nodes", version = "=0.1.0-alpha.1" }
narrata-content-local = { path = "../narrata-content-local", version = "=0.1.0-alpha.1" }
narrata-graph = { path = "../narrata-graph", version = "=0.1.0-alpha.1" }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
getrandom = "0.3.4"

[dev-dependencies]
narrata-history = { path = "../../../kernel/crates/narrata-history", version = "=0.1.0-alpha.1" }
proptest.workspace = true
tempfile = "3.21.0"

[lints]
workspace = true
